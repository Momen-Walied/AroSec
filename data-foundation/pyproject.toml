[project]
name = "vigilance-data-foundation"
version = "0.1.0"
description = "Vigilance Data Foundation v0.1 — canonical contracts and normalized temporal cyber-graph data for IIoT/ICS cybersecurity AI."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Vigilance AI/Data Engineering" }]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6.0,<7",
    "pandas>=2.2,<3",
    "pyarrow>=16,<22",
    "numpy>=1.26,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# Raw PCAP parsing is optional; the core pipeline works on CSV/flow/parquet.
pcap = ["scapy>=2.5,<3"]
graph = ["neo4j>=5.20,<6"]
# AI Phase 1 (Edge Behavior Intelligence). CPU-only; no GPU/deep-learning frameworks.
ai = ["scikit-learn>=1.4,<2", "matplotlib>=3.8,<4"]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]

[project.scripts]
vigilance-data = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
